databaseChangeLog:
  - changeSet:
      id: ddl-alter-001-migrate-user-identifiers-to-uuid
      author: JulianaFerro1428
      comment: "Expand Identity & Access identifiers with UUID columns while keeping BIGINT identifiers active."
